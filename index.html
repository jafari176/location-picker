
  <!-- Google Places API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB0pL37G9uayPSvELKkM8mNylAREgfzX_w&libraries=places"></script>

  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f5f5f5;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      width: 350px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: not-allowed;
      background: #ccc;
      color: white;
    }

    button.active {
      background: #25D366;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Book Ride</h2>

  <input id="pickup" placeholder="Pickup location">
  <input id="destination" placeholder="Destination location">

  <button id="submitBtn" disabled>Submit</button>
</div>

<script>
const pickupInput = document.getElementById("pickup");
const destInput = document.getElementById("destination");
const submitBtn = document.getElementById("submitBtn");

let pickupData = null;
let destData = null;

function enableButton() {
  if (pickupData && destData) {
    submitBtn.disabled = false;
    submitBtn.classList.add("active");
  }
}

function initAutocomplete() {
  const pickupAuto = new google.maps.places.Autocomplete(pickupInput);
  const destAuto = new google.maps.places.Autocomplete(destInput);

  pickupAuto.addListener("place_changed", () => {
    const place = pickupAuto.getPlace();

    pickupData = {
      address: place.formatted_address,
      lat: place.geometry.location.lat(),
      lng: place.geometry.location.lng(),
    };

    enableButton();
  });

  destAuto.addListener("place_changed", () => {
    const place = destAuto.getPlace();

    destData = {
      address: place.formatted_address,
      lat: place.geometry.location.lat(),
      lng: place.geometry.location.lng(),
    };

    enableButton();
  });
}

submitBtn.onclick = async () => {
  if (submitBtn.disabled) return;

  await fetch("/api/webhook", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      pickup: pickupData,
      destination: destData,
    }),
  });

  window.location.href =
    "https://wa.me/447888873795?text=" +
    encodeURIComponent(
      "Pickup: " + pickupData.address +
      "\nLat: " + pickupData.lat +
      "\nLng: " + pickupData.lng +
      "\n\nDestination: " + destData.address +
      "\nLat: " + destData.lat +
      "\nLng: " + destData.lng
    );
};

initAutocomplete();
</script>

</body>
</html>
